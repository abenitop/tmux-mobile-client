<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:390px; height:844px; background:#FAF9F5; font-family:'Bricolage Grotesque',sans-serif; color:#2C2A26; display:flex; flex-direction:column; overflow:hidden; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .bar { display:flex; align-items:center; padding:16px; }
  .bar h1 { font-size:24px; font-weight:800; flex:1; }
  .cancel { font-size:14px; color:#A39D92; }
  .form { padding:0 16px; display:flex; flex-direction:column; gap:14px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:12px; color:#A39D92; font-family:'JetBrains Mono',monospace; }
  .field input { height:50px; border-radius:14px; border:1px solid #D8D2C6; background:#EDE8DF; padding:0 16px; font-size:15px; color:#2C2A26; font-family:'JetBrains Mono',monospace; }
  .field input::placeholder { color:#A39D92; }
  .row { display:flex; gap:10px; }
  .row .field { flex:1; }
  .create { margin:20px 16px 0; height:52px; border-radius:26px; background:#0F0E0C; color:#EDE8DF; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; }
</style></head><body>
  <div class="bar"><h1>New session</h1><span class="cancel">Cancel</span></div>
  <div class="form">
    <div class="field"><label>HOST</label><input placeholder="vps.example.com"></div>
    <div class="field"><label>USER</label><input placeholder="agent-stack"></div>
    <div class="row">
      <div class="field"><label>PORT</label><input placeholder="22"></div>
      <div class="field"><label>NAME</label><input placeholder="api-refactor"></div>
    </div>
    <div class="field"><label>PASSWORD</label><input placeholder="••••••••"></div>
  </div>
  <div class="create">Create session</div>
</body></html>
