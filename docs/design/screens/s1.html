<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:390px; height:844px; background:#FAF9F5; font-family:'Bricolage Grotesque',sans-serif; color:#2C2A26; padding:0; position:relative; overflow:hidden; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:20px 20px 8px; }
  .top .host { font-family:'JetBrains Mono',monospace; font-size:12px; color:#A39D92; }
  .gear { width:44px; height:44px; border-radius:22px; border:1px solid #2C2A26; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .head { padding:8px 20px 4px; }
  .head h1 { font-size:30px; font-weight:800; letter-spacing:-0.5px; }
  .head .sub { font-size:14px; color:#A39D92; margin-top:2px; }
  .list { padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  .card { background:#EDE8DF; border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .card .row1 { display:flex; justify-content:space-between; align-items:center; }
  .card .name { font-size:17px; font-weight:700; }
  .badge { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:600; padding:4px 10px; border-radius:12px; }
  .badge.amber { background:#F2A93B; color:#1A1305; }
  .badge.green { background:#7BC96F; color:#142514; }
  .card .meta { font-size:13px; color:#3A3730; }
  .card .meta2 { font-family:'JetBrains Mono',monospace; font-size:11px; color:#A39D92; }
  .logs { margin:2px 16px; display:flex; gap:10px; }
  .logchip { flex:1; background:#F0EEE6; border-radius:14px; padding:12px; font-size:13px; color:#3A3730; }
  .newbtn { position:absolute; left:16px; right:16px; bottom:24px; height:52px; border-radius:26px; background:#0F0E0C; color:#EDE8DF; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; }
  .newbtn .plus { color:#70E080; margin-right:8px; font-size:20px; }
</style></head><body>
  <div class="top"><span class="host">vps · agent-stack</span><div class="gear">⚙</div></div>
  <div class="head"><h1>Sessions</h1><div class="sub">4 running · 1 needs you</div></div>
  <div class="list">
    <div class="card">
      <div class="row1"><span class="name">api-refactor</span><span class="badge amber">NEEDS APPROVAL</span></div>
      <div class="meta">claude · Edit src/auth/session.ts</div>
      <div class="meta2">3 windows · waiting 2m</div>
    </div>
    <div class="card">
      <div class="row1"><span class="name">hermes</span><span class="badge amber">WORKING</span></div>
      <div class="meta">hermes · indexing corpus</div>
    </div>
    <div class="card">
      <div class="row1"><span class="name">screener</span><span class="badge green">DONE · 14m</span></div>
      <div class="meta">claude · tests passing, committed</div>
    </div>
  </div>
  <div class="logs"><div class="logchip">logs</div><div class="logchip">htop · no agent</div></div>
  <div class="newbtn"><span class="plus">+</span> New session</div>
</body></html>
